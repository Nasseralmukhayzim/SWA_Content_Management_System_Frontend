<div class="media-edit">
  <a mat-button routerLink="..">
    <mat-icon>arrow_back</mat-icon>
    Back to Media
  </a>

  @if (loading()) {
    <mat-progress-spinner mode="indeterminate" diameter="32" />
  } @else if (asset(); as a) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ a.originalFileName }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        @if (a.kind === MediaKind.Image) {
          <img [src]="a.url" alt="" class="media-edit__preview" />
        } @else if (isPdf()) {
          <iframe [src]="pdfPreviewUrl()" class="media-edit__pdf-preview" title="PDF preview"></iframe>
        }

        <a mat-stroked-button [href]="a.url" target="_blank" rel="noopener noreferrer" class="media-edit__download">
          <mat-icon>download</mat-icon>
          Download {{ a.originalFileName }}
        </a>

        <form [formGroup]="form" class="media-edit__grid">
          <mat-form-field appearance="outline">
            <mat-label>Title (Arabic)</mat-label>
            <input matInput formControlName="titleAr" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Title (English)</mat-label>
            <input matInput formControlName="titleEn" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Alt text (Arabic)</mat-label>
            <input matInput formControlName="altTextAr" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Alt text (English)</mat-label>
            <input matInput formControlName="altTextEn" />
          </mat-form-field>
        </form>
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="primary" [disabled]="saving()" (click)="save()">Save</button>
      </mat-card-actions>
    </mat-card>
  }
</div>
