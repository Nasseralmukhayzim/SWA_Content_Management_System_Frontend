<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>SWA Content Management System</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" autocomplete="username" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>
        @if (error()) {
          <p class="login__error">{{ error() }}</p>
        }
        <button mat-flat-button color="primary" class="login__submit" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-progress-spinner mode="indeterminate" diameter="20" />
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
