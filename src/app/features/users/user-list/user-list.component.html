<div class="user-list">
  <div class="user-list__header">
    <h1>Users</h1>
    <a mat-flat-button color="primary" routerLink="new">
      <mat-icon>add</mat-icon>
      New User
    </a>
  </div>

  @if (loading()) {
    <mat-progress-spinner mode="indeterminate" diameter="32" />
  } @else {
    <div class="user-list__table-scroll">
    <table mat-table [dataSource]="users()" class="user-list__table">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ fullName(row) }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip-set>
            @for (role of row.roles; track role) {
              <mat-chip>{{ role }}</mat-chip>
            }
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <a mat-icon-button [routerLink]="[row.id]" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="remove(row)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>
  }
</div>
