<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="shell__sidenav"
  >
    <div class="shell__brand">
      <img src="logo.png" alt="Saudi Water Authority" class="shell__brand-logo" />
    </div>

    <mat-nav-list class="shell__nav">
      @for (item of navItems(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          (click)="isHandset() && sidenav.close()"
        >
          <span matListItemIcon class="shell__nav-icon">
            <mat-icon>{{ item.icon }}</mat-icon>
          </span>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="shell__header">
      <button
        mat-icon-button
        class="shell__menu-toggle"
        (click)="sidenav.toggle()"
        aria-label="Toggle navigation"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div class="shell__greeting">
        <h1>{{ greeting() }}, <span class="shell__greeting-name">{{ displayName() }}</span></h1>
        <p>SWA Content Management &middot; {{ today() }}</p>
      </div>

      <span class="shell__spacer"></span>

      <button mat-button class="shell__user" [matMenuTriggerFor]="userMenu">
        <span class="shell__user-email">{{ auth.userEmail() }}</span>
        <span class="shell__user-avatar">{{ initial() }}</span>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="shell__user-menu-header">
          <span class="shell__user-menu-title">Administrator</span>
          <span class="shell__user-menu-email">{{ auth.userEmail() }}</span>
        </div>
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>My profile</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button mat-menu-item class="shell__user-menu-signout" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
