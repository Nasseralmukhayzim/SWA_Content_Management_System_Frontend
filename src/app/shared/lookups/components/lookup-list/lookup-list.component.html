<div class="lookup-list">
  <div class="lookup-list__header">
    <h1>{{ config.displayName }}</h1>
    <a mat-flat-button color="primary" routerLink="new">
      <mat-icon>add</mat-icon>
      New {{ config.displayName }}
    </a>
  </div>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="lookup-list__filter">
    <mat-label>Active</mat-label>
    <mat-select [formControl]="isActiveFilter">
      <mat-option [value]="null">Any</mat-option>
      <mat-option [value]="true">Yes</mat-option>
      <mat-option [value]="false">No</mat-option>
    </mat-select>
  </mat-form-field>

  @if (loading()) {
  <mat-progress-spinner mode="indeterminate" diameter="32" />
  } @else {
  <table mat-table [dataSource]="items()" class="lookup-list__table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.nameAr || row.nameEn }}</td>
    </ng-container>
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let row">{{ row.isActive ? 'Yes' : 'No' }}</td>
    </ng-container>
    <ng-container matColumnDef="sortOrder">
      <th mat-header-cell *matHeaderCellDef>Sort order</th>
      <td mat-cell *matCellDef="let row">{{ row.sortOrder }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-icon-button [routerLink]="[row.id]" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="remove(row)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [length]="totalCount()" [pageIndex]="pageIndex()" [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50]" (page)="onPage($event)" />
  }
</div>
