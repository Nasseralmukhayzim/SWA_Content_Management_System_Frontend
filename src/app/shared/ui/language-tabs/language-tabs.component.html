<mat-tab-group [(selectedIndex)]="selectedIndex" preserveContent>
  @for (lang of languages(); track lang.code) {
    <mat-tab [label]="lang.label">
      <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="templateFor(lang.code)" />
      </ng-template>
    </mat-tab>
  }
</mat-tab-group>
