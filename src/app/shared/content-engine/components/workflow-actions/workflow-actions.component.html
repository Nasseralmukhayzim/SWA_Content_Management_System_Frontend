@if (actions().length) {
  <div class="workflow-actions">
    @for (action of actions(); track action.key) {
      <button
        mat-stroked-button
        type="button"
        [disabled]="!canRun(action) || pending()"
        [matTooltip]="tooltipFor(action) | translate"
        (click)="run(action)"
      >
        {{ action.labelKey | translate }}
      </button>
    }
  </div>
}

@if (isDeletionPending()) {
  <div class="workflow-actions__deletion-banner">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span>{{ deletionStatusLabelKey() | translate }}</span>
  </div>
}

@if (deletionActions().length) {
  <div class="workflow-actions workflow-actions--deletion">
    @for (action of deletionActions(); track action.key) {
      <button
        mat-stroked-button
        type="button"
        color="warn"
        [disabled]="!canRunDeletion(action) || pending()"
        (click)="runDeletion(action)"
      >
        {{ action.labelKey | translate }}
      </button>
    }
  </div>
}
